site_name: Bluecom Documentation
site_description: Bluecom eSIM platform documentation
copyright: Copyright &copy; 2026 Bluecom. All rights reserved.
theme:
  name: material
  font:
    text: Manrope
    code: JetBrains Mono
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Overview:
      - overview/index.md
      - Architecture: overview/architecture.md
  - Onboarding:
      - onboarding/index.md
      - Checklist: onboarding/checklist.md
      - Request Access: onboarding/request-access.md
      - Environments: onboarding/environments.md
  - Integration:
      - integration/index.md
      - Authentication: integration/authentication.md
      - Embedding: integration/embedding.md
      - Session Lifecycle: integration/session-lifecycle.md
      - Payment Return: integration/payment-return.md
  - Customization:
      - customization/index.md
      - Theming: customization/theming.md
      - Localization: customization/localization.md
  - Operations:
      - operations/index.md
      - Tracking Events: operations/tracking-events.md
      - Dashboard: operations/dashboard.md
      - Support: operations/support.md
  - Reference:
      - Error Codes: reference/error-codes.md
      - Glossary: reference/glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false

extra_css:
  - assets/stylesheets/bluecom.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

site_name: Bluecom Documentation
site_description: Bluecom eSIM platform documentation
copyright: Copyright &copy; 2026 Bluecom. All rights reserved.
theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Overview:
      - overview/index.md
      - Architecture: overview/architecture.md
  - Onboarding:
      - onboarding/index.md
      - Checklist: onboarding/checklist.md
      - Request Access: onboarding/request-access.md
      - Environments: onboarding/environments.md
  - Integration:
      - integration/index.md
      - Authentication: integration/authentication.md
      - Embedding: integration/embedding.md
      - Session Lifecycle: integration/session-lifecycle.md
      - Payment Return: integration/payment-return.md
  - Payment Gateway:
      - payment-gateway/index.md
      - Architecture: payment-gateway/architecture.md
      - Checklist: payment-gateway/checklist.md
      - Webhook Contract: payment-gateway/webhook-contract.md
      - Testing & Go-Live: payment-gateway/testing.md
      - Timeline: payment-gateway/timeline.md
  - Customization:
      - customization/index.md
      - Theming: customization/theming.md
      - Localization: customization/localization.md
  - Operations:
      - operations/index.md
      - Tracking Events: operations/tracking-events.md
      - Dashboard: operations/dashboard.md
      - Support: operations/support.md
  - Reference:
      - Error Codes: reference/error-codes.md
      - Glossary: reference/glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
          site_name: Tài liệu Bluecom
          nav_translations:
            Home: Trang chủ
            Overview: Tổng quan
            Architecture: Kiến trúc
            Onboarding: Onboarding
            Checklist: Danh sách kiểm tra
            Request Access: Yêu cầu truy cập
            Environments: Môi trường
            Integration: Tích hợp
            Authentication: Xác thực
            Embedding: Nhúng
            Session Lifecycle: Vòng đời phiên
            Payment Return: Trả về thanh toán
            Payment Gateway: Cổng thanh toán
            Webhook Contract: Hợp đồng Webhook
            Testing & Go-Live: Kiểm thử & Go-Live
            Timeline: Lộ trình
            Customization: Tuỳ chỉnh
            Theming: Giao diện
            Localization: Đa ngôn ngữ
            Operations: Vận hành
            Tracking Events: Sự kiện theo dõi
            Dashboard: Bảng điều khiển
            Support: Hỗ trợ
            Reference: Tham chiếu
            Error Codes: Mã lỗi
            Glossary: Thuật ngữ

extra:
  generator: false
  alternate:
    - name: English
      link: /
      lang: en
    - name: Tiếng Việt
      link: /vi/
      lang: vi

extra_css:
  - assets/stylesheets/bluecom.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
